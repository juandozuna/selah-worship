name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag must match package version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Ensure guide PDF
        run: |
          if [ ! -f docs/guide/Selah-Volunteer-Guide.pdf ]; then
            echo "Guide PDF must be committed at docs/guide/Selah-Volunteer-Guide.pdf"
            exit 1
          fi
          npm run dmg:extras
      - run: npm run assets
      - run: cargo test --workspace
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles app
      - run: npm run dmg:package
      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp docs/guide/Selah-Volunteer-Guide.pdf release-assets/
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" release-assets/
          # Place the guide beside the app in a zip for operators who skip the DMG layout extras
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" release-assets/Selah.app.zip
          ls -la release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Selah v${{ steps.version.outputs.version }}

            - macOS Apple Silicon DMG (unsigned)
            - Volunteer & ProPresenter guide PDF
            - MIDI mapping and learn, OSC commands, MTC/LTC chase, and timeline cues
            - Custom TTF/OTF font imports
            - Background / foreground media layers and optional NDI/Syphon composite

            Requires Apple Silicon and macOS 12+. This build is unsigned and not notarized.
            Physical MIDI/LTC devices and NDI/Syphon receivers still need hardware validation.

            Install: open the DMG, drag **Selah** to Applications, keep the PDF for volunteers.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
