[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure"]
exclude = ["src-tauri", "crates/renderer"]
resolver = "2"
[workspace.package]
version = "0.2.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
selah-domain = { path = "crates/domain" }
selah-application = { path = "crates/application" }
