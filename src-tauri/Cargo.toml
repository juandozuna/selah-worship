[package]
name = "selah-desktop"
version = "0.2.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
selah-domain = { path = "../crates/domain" }
selah-application = { path = "../crates/application" }
selah-infrastructure = { path = "../crates/infrastructure" }
selah-renderer = { path = "../crates/renderer" }
base64 = "0.22"
tiny_http = "0.12"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
cpal = "0.15"
rfd = "0.15"

midir = "0.11"
rosc = "0.11"
ltc = "0.2"
